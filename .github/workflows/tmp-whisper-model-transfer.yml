name: Temporary Whisper Small Model Transfer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  download-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download verified Whisper small model
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 \
            -o ggml-small-q5_1.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/98aa99a0a9db05ae2342309f5096248665f7cba3/ggml-small-q5_1.bin?download=true'
          echo 'ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  ggml-small-q5_1.bin' | sha256sum -c -
          ls -lh ggml-small-q5_1.bin

      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-q5-model
          path: ggml-small-q5_1.bin
          compression-level: 0
          retention-days: 1
