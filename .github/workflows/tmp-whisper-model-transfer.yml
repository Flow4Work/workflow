name: Temporary Whisper Model Transfer

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  download-and-split:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download verified Whisper model
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 \
            -o ggml-large-v3-turbo-q5_0.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/98aa99a0a9db05ae2342309f5096248665f7cba3/ggml-large-v3-turbo-q5_0.bin?download=true'
          echo '394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2  ggml-large-v3-turbo-q5_0.bin' | sha256sum -c -
          split -b 280M -d -a 2 ggml-large-v3-turbo-q5_0.bin model.part-
          ls -lh model.part-*

      - name: Upload model part 00
        uses: actions/upload-artifact@v4
        with:
          name: whisper-model-part-00
          path: model.part-00
          compression-level: 0
          retention-days: 1

      - name: Upload model part 01
        uses: actions/upload-artifact@v4
        with:
          name: whisper-model-part-01
          path: model.part-01
          compression-level: 0
          retention-days: 1

      - name: Upload model part 02
        uses: actions/upload-artifact@v4
        with:
          name: whisper-model-part-02
          path: model.part-02
          compression-level: 0
          retention-days: 1
